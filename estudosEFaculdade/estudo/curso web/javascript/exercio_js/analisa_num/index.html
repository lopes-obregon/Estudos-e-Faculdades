<!DOCTYPE html>
<html>
	<head>
		<title>Analizador De Números</title>
		<meta charset="utf-8">
		<link rel="stylesheet" type="text/css" href="style.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js" ></script>
		<script src="script.js"></script>
		<h1>Analizador De Números</h1>
	</head>
	<body>
		<section id="container">
			<div>
				<p>
					Números entre 1 a 100:
					<input type="number" name="num">
					<button onclick="adiciona()">Adicionar</button>
				</p>
			</div>
			<output>
				<select size="10" id="resultado" ></select>
				<label>
					<br>
					<button onclick="resultados_array()" >Finalizar</button>
				</label>
			</output>

		</section> 
	</body>
	<footer>Desenvolvido Por Renan Lopes Obregon.</footer>
</html>
